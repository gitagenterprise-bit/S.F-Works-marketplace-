{% extends "base.html" %}

{% block title %}
Admin Login | S. F Works
{% endblock %}

{% block content %}

<main class="sf-admin-login">

    <section class="admin-login-card">

        <div class="admin-logo">
            SF
        </div>

        <span class="admin-security-badge">
            🔐 ADMINISTRATOR ACCESS
        </span>

        <h1>
            Welcome, Admin
        </h1>

        <p class="admin-login-subtitle">
            Secure access to the S. F Works
            marketplace administration panel.
        </p>

        <div
            id="adminLoginMessage"
            class="admin-message"
            hidden
        ></div>

        <form
            id="adminLoginForm"
            autocomplete="on"
        >

            <div class="admin-field">

                <label for="adminEmail">
                    Administrator Email
                </label>

                <input
                    id="adminEmail"
                    type="email"
                    placeholder="admin@example.com"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="admin-field">

                <label for="adminPassword">
                    Password
                </label>

                <div class="admin-password">

                    <input
                        id="adminPassword"
                        type="password"
                        placeholder="Enter administrator password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="adminPasswordToggle"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="adminLoginButton"
                class="admin-login-button"
            >

                <span id="adminLoginText">
                    Sign in to Admin Panel
                </span>

            </button>

        </form>


        <div class="admin-security-footer">

            <span class="security-dot"></span>

            Protected administrator environment

        </div>

    </section>

</main>


<style>

.sf-admin-login {

    min-height: calc(100vh - 80px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 16px;

    background:
        radial-gradient(
            circle at top left,
            rgba(37,99,235,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(15,23,42,.10),
            transparent 35%
        ),
        #f8fafc;
}


.admin-login-card {

    width: 100%;

    max-width: 450px;

    padding: 42px;

    border: 1px solid #e2e8f0;

    border-radius: 26px;

    background: rgba(255,255,255,.98);

    box-shadow:
        0 30px 80px
        rgba(15,23,42,.14);

}


.admin-logo {

    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 22px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    box-shadow:
        0 12px 28px
        rgba(15,23,42,.20);
}


.admin-security-badge {

    display: inline-flex;

    padding: 7px 11px;

    border-radius: 999px;

    background: #eff6ff;

    color: #2563eb;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .08em;
}


.admin-login-card h1 {

    margin: 18px 0 8px;

    color: #0f172a;

    font-size: 34px;

    letter-spacing: -.04em;
}


.admin-login-subtitle {

    margin: 0 0 28px;

    color: #64748b;

    font-size: 13px;

    line-height: 1.7;
}


.admin-field {

    margin-bottom: 18px;
}


.admin-field label {

    display: block;

    margin-bottom: 8px;

    color: #1e293b;

    font-size: 12px;

    font-weight: 800;
}


.admin-field input {

    width: 100%;

    min-height: 52px;

    padding: 0 15px;

    border: 1px solid #dbe2ea;

    border-radius: 13px;

    outline: none;

    color: #0f172a;

    background: white;

    font-size: 14px;
}


.admin-field input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,.10);
}


.admin-password {

    position: relative;
}


.admin-password input {

    padding-right: 65px;
}


.admin-password button {

    position: absolute;

    right: 8px;

    top: 50%;

    transform: translateY(-50%);

    border: 0;

    border-radius: 8px;

    padding: 8px;

    background: #f1f5f9;

    color: #475569;

    font-size: 11px;

    font-weight: 800;
}


.admin-login-button {

    width: 100%;

    min-height: 53px;

    margin-top: 8px;

    border: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color: white;

    font-size: 13px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 12px 28px
        rgba(37,99,235,.22);
}


.admin-login-button:disabled {

    opacity: .65;

    cursor: not-allowed;
}


.admin-message {

    margin-bottom: 18px;

    padding: 12px;

    border-radius: 10px;

    font-size: 12px;
}


.admin-message.error {

    background: #fef2f2;

    color: #b91c1c;

    border: 1px solid #fecaca;
}


.admin-message.success {

    background: #f0fdf4;

    color: #15803d;

    border: 1px solid #bbf7d0;
}


.admin-security-footer {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 25px;

    padding-top: 18px;

    border-top: 1px solid #eef2f7;

    color: #94a3b8;

    font-size: 10px;
}


.security-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #22c55e;

}


@media(max-width:520px) {

    .admin-login-card {

        padding: 28px 21px;

        border-radius: 21px;
    }

}

</style>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "adminLoginForm"
            );

        const email =
            document.getElementById(
                "adminEmail"
            );

        const password =
            document.getElementById(
                "adminPassword"
            );

        const toggle =
            document.getElementById(
                "adminPasswordToggle"
            );

        const button =
            document.getElementById(
                "adminLoginButton"
            );

        const buttonText =
            document.getElementById(
                "adminLoginText"
            );

        const message =
            document.getElementById(
                "adminLoginMessage"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "admin-message " +
                type;

            message.hidden = false;
        }


        toggle.addEventListener(
            "click",
            function () {

                const visible =
                    password.type === "text";

                password.type =
                    visible
                        ? "password"
                        : "text";

                toggle.textContent =
                    visible
                        ? "Show"
                        : "Hide";
            }
        );


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                message.hidden = true;

                const emailValue =
                    email.value
                        .trim()
                        .toLowerCase();

                const passwordValue =
                    password.value;


                if (
                    !emailValue ||
                    !passwordValue
                ) {

                    showMessage(
                        "Administrator email and password are required.",
                        "error"
                    );

                    return;
                }


                button.disabled = true;

                buttonText.textContent =
                    "Authenticating...";


                try {

                    const response =
                        await fetch(
                            "/api/admin/login",
                            {
                                method: "POST",

                                credentials: "include",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            emailValue,

                                        password:
                                            passwordValue
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        response.ok &&
                        result.status === "success"
                    ) {

                        showMessage(
                            "Authentication successful. Opening Admin Panel...",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.replace(
                                    "/admin/dashboard"
                                );

                            },
                            400
                        );

                        return;
                    }


                    showMessage(
                        result.message ||
                        "Administrator authentication failed.",
                        "error"
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                } finally {

                    button.disabled = false;

                    buttonText.textContent =
                        "Sign in to Admin Panel";
                }

            }
        );

    }
);

</script>

{% endblock %}
