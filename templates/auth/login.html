{% extends "base.html" %}

{% block title %}
Login | S. F Works Marketplace
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-badge">
                S. F Works
            </span>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue to your marketplace account.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
        >

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a
                href="{{ url_for('auth.register') }}"
            >
                Create Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
