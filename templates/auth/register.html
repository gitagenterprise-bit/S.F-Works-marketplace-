{% extends "base.html" %}

{% block title %}
Create Account | S. F Works Marketplace
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-badge">
                S. F Works
            </span>

            <h1>
                Create Your Account
            </h1>

            <p>
                Join the S. F Works Marketplace.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
        >

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Your phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Account Type
                </label>

                <select
                    name="role"
                    required
                >

                    <option value="customer">
                        Customer — Post Jobs
                    </option>

                    <option value="worker">
                        Worker — Find Jobs
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a
                href="{{ url_for('auth.login') }}"
            >
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
