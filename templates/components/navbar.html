<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const navbar =
            document.getElementById(
                "topNavbar"
            );


        const menuButton =
            document.getElementById(
                "mobileMenuBtn"
            );


        const mobileNav =
            document.getElementById(
                "mobileNav"
            );


        /* =============================================
           MOBILE MENU
        ============================================== */

        if (
            menuButton &&
            mobileNav
        ) {

            menuButton.addEventListener(
                "click",
                function () {

                    const isOpen =
                        mobileNav.classList.toggle(
                            "open"
                        );


                    menuButton.setAttribute(
                        "aria-expanded",
                        isOpen
                    );


                    mobileNav.setAttribute(
                        "aria-hidden",
                        !isOpen
                    );


                    menuButton.classList.toggle(
                        "active",
                        isOpen
                    );

                }
            );


            /* Close after navigation */

            const mobileLinks =
                mobileNav.querySelectorAll(
                    "a"
                );


            mobileLinks.forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            mobileNav.classList.remove(
                                "open"
                            );

                            menuButton.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                            mobileNav.setAttribute(
                                "aria-hidden",
                                "true"
                            );

                        }
                    );

                }
            );

        }


        /* =============================================
           NAVBAR SCROLL EFFECT
        ============================================== */

        function updateNavbar() {

            if (!navbar) {
                return;
            }


            if (
                window.scrollY > 10
            ) {

                navbar.classList.add(
                    "scrolled"
                );

            } else {

                navbar.classList.remove(
                    "scrolled"
                );

            }

        }


        updateNavbar();


        window.addEventListener(
            "scroll",
            updateNavbar,
            {
                passive: true
            }
        );


        /* =============================================
           CLOSE MOBILE MENU ON RESIZE
        ============================================== */

        window.addEventListener(
            "resize",
            function () {

                if (
                    window.innerWidth > 720
                ) {

                    if (mobileNav) {

                        mobileNav.classList.remove(
                            "open"
                        );

                    }


                    if (menuButton) {

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }

            }
        );

    }
);

                    </script>
