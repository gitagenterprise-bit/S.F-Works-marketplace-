<!-- =========================================================
     SIDEBAR CSS
========================================================= -->

<style>

/* =========================================================
   RESET
========================================================= */

.dashboard-sidebar,
.dashboard-sidebar * {

    box-sizing: border-box;

}


/* =========================================================
   SIDEBAR
========================================================= */

.dashboard-sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 250px;
    height: 100vh;

    z-index: 1000;

    display: flex;
    flex-direction: column;

    padding: 22px 14px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #fbfdff 100%
        );

    border-right:
        1px solid
        #e2e8f0;

    box-shadow:
        8px 0 30px
        rgba(15, 23, 42, 0.035);

    overflow-x: hidden;
    overflow-y: auto;

    scrollbar-width: thin;

    scrollbar-color:
        #cbd5e1
        transparent;

}


/* =========================================================
   SCROLLBAR
========================================================= */

.dashboard-sidebar::-webkit-scrollbar {

    width: 5px;

}


.dashboard-sidebar::-webkit-scrollbar-track {

    background: transparent;

}


.dashboard-sidebar::-webkit-scrollbar-thumb {

    border-radius: 10px;

    background: #cbd5e1;

}


/* =========================================================
   BRAND
========================================================= */

.sidebar-brand {

    width: 100%;

    flex-shrink: 0;

    padding:
        2px
        6px
        24px;

}


.sidebar-brand-link {

    display: flex;

    align-items: center;

    gap: 11px;

    width: 100%;

    color: inherit;

    text-decoration: none;

}


.sidebar-brand-mark {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #2563eb 0%,
            #1d4ed8 100%
        );

    color: #ffffff;

    font-family:
        Inter,
        system-ui,
        sans-serif;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: .2px;

    box-shadow:
        0 8px 20px
        rgba(37, 99, 235, .22);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


.sidebar-brand-link:hover
.sidebar-brand-mark {

    transform:
        translateY(-1px);

    box-shadow:
        0 11px 25px
        rgba(37, 99, 235, .28);

}


.sidebar-brand-text {

    min-width: 0;

    display: flex;

    flex-direction: column;

    line-height: 1.1;

}


.sidebar-brand-text strong {

    display: block;

    color: #0f172a;

    font-family:
        Inter,
        system-ui,
        sans-serif;

    font-size: 15px;

    font-weight: 800;

    white-space: nowrap;

}


.sidebar-brand-text small {

    display: block;

    margin-top: 5px;

    color: #94a3b8;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: .65px;

    text-transform: uppercase;

    white-space: nowrap;

}


/* =========================================================
   NAVIGATION
========================================================= */

.sidebar-nav {

    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

    gap: 5px;

}


/* =========================================================
   LINKS
========================================================= */

.sidebar-link {

    position: relative;

    width: 100%;
    min-height: 46px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        0 12px;

    border:
        1px solid
        transparent;

    border-radius: 11px;

    background: transparent;

    color: #64748b;

    font-family: inherit;

    font-size: 12px;

    font-weight: 650;

    line-height: 1;

    text-align: left;

    text-decoration: none;

    cursor: pointer;

    transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;

}


.sidebar-link:hover {

    color: #1d4ed8;

    background: #f8fafc;

    border-color: #eef2f7;

    transform:
        translateX(2px);

}


/* =========================================================
   ACTIVE LINK

   JavaScript below automatically adds .active
========================================================= */

.sidebar-link.active {

    color: #1d4ed8;

    background:
        linear-gradient(
            90deg,
            #eff6ff 0%,
            #f8fbff 100%
        );

    border-color: #dbeafe;

    box-shadow:
        0 5px 15px
        rgba(37, 99, 235, .06);

}


.sidebar-link.active::before {

    content: "";

    position: absolute;

    left: -14px;

    top: 8px;

    width: 3px;

    height: 30px;

    border-radius:
        0 4px 4px 0;

    background: #2563eb;

}


/* =========================================================
   ICON
========================================================= */

.sidebar-icon {

    width: 20px;
    height: 20px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #94a3b8;

    transition:
        color .2s ease,
        transform .2s ease;

}


.sidebar-icon svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;

}


.sidebar-link:hover
.sidebar-icon {

    color: #2563eb;

    transform:
        scale(1.05);

}


.sidebar-link.active
.sidebar-icon {

    color: #2563eb;

}


/* =========================================================
   LABEL
========================================================= */

.sidebar-label {

    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

}


/* =========================================================
   DIVIDER
========================================================= */

.sidebar-divider {

    width:
        calc(100% - 16px);

    height: 1px;

    flex-shrink: 0;

    margin:
        13px 8px;

    background: #eef2f7;

}


/* =========================================================
   LOGOUT BUTTON
========================================================= */

.sidebar-logout-button {

    appearance: none;

    -webkit-appearance: none;

    border:
        1px solid
        transparent;

    outline: none;

}


.sidebar-logout-button:hover {

    color: #dc2626;

    background: #fef2f2;

    border-color: #fee2e2;

}


.sidebar-logout-button:hover
.sidebar-icon {

    color: #dc2626;

}


/* =========================================================
   FOOTER
========================================================= */

.sidebar-footer {

    width: 100%;

    flex-shrink: 0;

    padding:
        15px 6px 3px;

    margin-top: 8px;

    border-top:
        1px solid
        #eef2f7;

}


.sidebar-secure {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px;

    border:
        1px solid
        #eef2f7;

    border-radius: 12px;

    background: #f8fafc;

}


.secure-dot {

    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #22c55e;

    box-shadow:
        0 0 0 4px
        rgba(34, 197, 94, .10);

}


.sidebar-secure-content {

    min-width: 0;

}


.sidebar-secure strong {

    display: block;

    color: #475569;

    font-size: 10px;

    font-weight: 700;

    line-height: 1.2;

}


.sidebar-secure small {

    display: block;

    margin-top: 3px;

    color: #94a3b8;

    font-size: 8px;

    line-height: 1.2;

    white-space: nowrap;

}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .dashboard-sidebar {

        width: 220px;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .dashboard-sidebar {

        width: 280px;

        transform:
            translateX(-100%);

        transition:
            transform .25s ease;

        box-shadow:
            12px 0 35px
            rgba(15, 23, 42, .16);

    }


    /*
       dashboard-layout.sidebar-open
       is controlled by dashboard_base.html
    */

    .dashboard-layout.sidebar-open
    .dashboard-sidebar {

        transform:
            translateX(0);

    }


    .sidebar-brand {

        padding:
            3px
            7px
            22px;

    }


    .sidebar-brand-text {

        display: flex;

    }


    .sidebar-label {

        display: block;

    }


    .sidebar-footer {

        display: block;

    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

    .dashboard-sidebar {

        width: 270px;

    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .dashboard-sidebar,
    .sidebar-link,
    .sidebar-icon,
    .sidebar-brand-mark {

        transition: none;

    }

}

</style>


<!-- =========================================================
     SIDEBAR JAVASCRIPT

     - Active menu
     - Logout
========================================================= -->

<script>

(function () {

    "use strict";


    /* =====================================================
       ACTIVE MENU
    ====================================================== */

    const currentPath =
        window.location.pathname;


    const sidebarLinks =
        document.querySelectorAll(
            ".sidebar-link[href]"
        );


    sidebarLinks.forEach(
        function (link) {

            const href =
                link.getAttribute("href");


            if (
                href &&
                href !== "#" &&
                currentPath === href
            ) {

                link.classList.add(
                    "active"
                );

            }

        }
    );


    /* =====================================================
       LOGOUT
    ====================================================== */

    const logoutButton =
        document.getElementById(
            "sidebarLogoutButton"
        );


    if (!logoutButton) {

        return;

    }


    logoutButton.addEventListener(
        "click",
        function () {

            try {

                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "refresh_token"
                );

                sessionStorage.removeItem(
                    "access_token"
                );

                sessionStorage.removeItem(
                    "refresh_token"
                );

            }
            catch (error) {

                console.warn(
                    "Unable to clear authentication storage.",
                    error
                );

            }


            window.location.href =
                "/login";

        }
    );

})();

     </script>
