<div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
>
</div>


<style>

/* =========================================================
   S. F WORKS — PREMIUM TOAST SYSTEM
========================================================= */

.toast-container {

    position:
        fixed;

    top:
        22px;

    right:
        22px;

    z-index:
        999999;

    width:
        min(
            380px,
            calc(100vw - 32px)
        );

    display:
        flex;

    flex-direction:
        column;

    align-items:
        stretch;

    gap:
        10px;

    pointer-events:
        none;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position:
        relative;

    display:
        flex;

    align-items:
        flex-start;

    gap:
        12px;

    min-height:
        66px;

    padding:
        13px 14px;

    overflow:
        hidden;

    border:
        1px solid
        rgba(226,232,240,0.9);

    border-radius:
        15px;

    background:
        rgba(255,255,255,0.97);

    box-shadow:
        0 18px 45px
        rgba(15,23,42,0.13);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    pointer-events:
        auto;

    opacity:
        0;

    transform:
        translateX(25px)
        scale(0.97);

    animation:
        toastIn 0.28s
        cubic-bezier(
            0.22,
            1,
            0.36,
            1
        )
        forwards;
}


/* =========================================================
   ENTER ANIMATION
========================================================= */

@keyframes toastIn {

    from {

        opacity:
            0;

        transform:
            translateX(25px)
            scale(0.97);
    }

    to {

        opacity:
            1;

        transform:
            translateX(0)
            scale(1);
    }
}


/* =========================================================
   EXIT
========================================================= */

.toast.toast-removing {

    animation:
        toastOut 0.22s
        ease
        forwards;
}


@keyframes toastOut {

    to {

        opacity:
            0;

        transform:
            translateX(25px)
            scale(0.97);
    }
}


/* =========================================================
   ICON
========================================================= */

.toast-icon {

    width:
        36px;

    height:
        36px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-shrink:
        0;

    border-radius:
        10px;

    font-size:
        16px;

    font-weight:
        800;
}


/* =========================================================
   CONTENT
========================================================= */

.toast-content {

    flex:
        1;

    min-width:
        0;

    padding-top:
        1px;
}


.toast-title {

    display:
        block;

    color:
        #0f172a;

    font-family:
        var(--font-heading);

    font-size:
        12px;

    font-weight:
        750;

    line-height:
        1.3;
}


.toast-message {

    display:
        block;

    margin-top:
        3px;

    color:
        #64748b;

    font-size:
        11px;

    line-height:
        1.45;

    word-break:
        break-word;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.toast-close {

    width:
        25px;

    height:
        25px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-shrink:
        0;

    margin:
        -3px -3px 0 0;

    padding:
        0;

    border:
        0;

    border-radius:
        7px;

    background:
        transparent;

    color:
        #94a3b8;

    font-size:
        17px;

    line-height:
        1;

    cursor:
        pointer;

    transition:
        all 0.18s ease;
}


.toast-close:hover {

    background:
        #f1f5f9;

    color:
        #475569;
}


/* =========================================================
   PROGRESS BAR
========================================================= */

.toast-progress {

    position:
        absolute;

    left:
        0;

    bottom:
        0;

    width:
        100%;

    height:
        3px;

    transform-origin:
        left;

    animation:
        toastProgress
        var(--toast-duration, 4000ms)
        linear
        forwards;
}


@keyframes toastProgress {

    from {

        transform:
            scaleX(1);
    }

    to {

        transform:
            scaleX(0);
    }
}


/* =========================================================
   SUCCESS
========================================================= */

.toast-success {

    border-color:
        #dcfce7;
}


.toast-success .toast-icon {

    background:

}

    background:

}


/* =========================================================

========================================================= */

.toast-error {

    border-color:
        #fee2e2;
}


.toast-error .toast-icon {

    background:
        #fef2f2;

    color:
        #dc2626;
}


.toast-error .toast-progress {

    background:
        #ef4444;
}


/* =========================================================
   WARNING
========================================================= */

.toast-warning {

    border-color:
        #fef3c7;
}


.toast-warning .toast-icon {

    background:
        #fffbeb;

    color:
        #d97706;
}


.toast-warning .toast-progress {

    background:
        #f59e0b;
}


/* =========================================================
   INFO
========================================================= */

.toast-info {

    border-color:
        #dbeafe;
}


.toast-info .toast-icon {

    background:
        #eff6ff;

    color:
        #2563eb;
}


.toast-info .toast-progress {

    background:
        #3b82f6;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .toast-container {

        top:
            12px;

        right:
            12px;

        left:
            12px;

        width:
            auto;
    }


    .toast {

        min-height:
            62px;

        padding:
            12px;

        border-radius:
            14px;

        transform:
            translateY(-15px)
            scale(0.98);
    }


    @keyframes toastIn {

        from {

            opacity:
                0;

            transform:
                translateY(-15px)
                scale(0.98);
        }

        to {

            opacity:
                1;

            transform:
                translateY(0)
                scale(1);
        }
    }


    @keyframes toastOut {

        to {

            opacity:
                0;

            transform:
                translateY(-10px)
                scale(0.98);
        }
    }


    .toast-icon {

        width:
            34px;

        height:
            34px;

        border-radius:
            9px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .toast,
    .toast.toast-removing,
    .toast-progress {

        animation:
            none !important;
    }

}

</style>
