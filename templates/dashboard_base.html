<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Dashboard
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/app.css'
        ) }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/dashboard.css'
        ) }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/admin.css'
    ) }}"
>

    

</head>

<body>

<div class="dashboard-layout">

    {% include
        "components/sidebar.html"
    %}

    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <h1>
                    {% block page_title %}
                    Dashboard
                    {% endblock %}
                </h1>

                <p>
                    Welcome back.
                </p>

            </div>

            <div
                class="dashboard-user"
            >
                SF
            </div>

        </header>


        <section
            class="dashboard-content"
        >

            {% block dashboard_content %}
            {% endblock %}

        </section>

    </main>

</div>

</body>

</html>
